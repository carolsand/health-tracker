<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .node { fill: #ffffff; stroke: #e6e2da; stroke-width: 1.5; }
      .title { font-size: 15px; font-weight: 700; fill: #2b2b2b; }
      .desc  { font-size: 11.5px; fill: #6b6b6b; }
      .spoke { stroke: #cfd8d7; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1000" height="560" fill="#faf9f6"/>

  <!-- spokes -->
  <g class="spoke">
    <line x1="500" y1="280" x2="500" y2="90"/>
    <line x1="500" y1="280" x2="742" y2="150"/>
    <line x1="500" y1="280" x2="820" y2="360"/>
    <line x1="500" y1="280" x2="660" y2="490"/>
    <line x1="500" y1="280" x2="340" y2="490"/>
    <line x1="500" y1="280" x2="180" y2="360"/>
    <line x1="500" y1="280" x2="258" y2="150"/>
  </g>

  <!-- hub -->
  <circle cx="500" cy="280" r="72" fill="#4f46e5"/>
  <text x="500" y="272" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Health</text>
  <text x="500" y="294" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Tracker</text>

  <!-- Home / Dashboard -->
  <g transform="translate(430,30)">
    <rect class="node" x="0" y="0" width="140" height="62" rx="12"/>
    <text class="title" x="70" y="24" text-anchor="middle">🏠 Home</text>
    <text class="desc" x="70" y="42" text-anchor="middle">Today's plan &amp;</text>
    <text class="desc" x="70" y="55" text-anchor="middle">weekly stats</text>
  </g>

  <!-- Exercise -->
  <g transform="translate(672,100)">
    <rect class="node" x="0" y="0" width="150" height="62" rx="12"/>
    <text class="title" x="75" y="24" text-anchor="middle">🏋️ Exercise</text>
    <text class="desc" x="75" y="42" text-anchor="middle">Week-by-week</text>
    <text class="desc" x="75" y="55" text-anchor="middle">knee-safe plan</text>
  </g>

  <!-- Recipes -->
  <g transform="translate(755,320)">
    <rect class="node" x="0" y="0" width="150" height="62" rx="12"/>
    <text class="title" x="75" y="24" text-anchor="middle">🍽️ Recipes</text>
    <text class="desc" x="75" y="42" text-anchor="middle">Pantry match +</text>
    <text class="desc" x="75" y="55" text-anchor="middle">online ideas</text>
  </g>

  <!-- Doctor Visit -->
  <g transform="translate(590,455)">
    <rect class="node" x="0" y="0" width="150" height="62" rx="12"/>
    <text class="title" x="75" y="24" text-anchor="middle">🩺 Doctor Visit</text>
    <text class="desc" x="75" y="42" text-anchor="middle">Questions &amp;</text>
    <text class="desc" x="75" y="55" text-anchor="middle">notes for appts</text>
  </g>

  <!-- Progress -->
  <g transform="translate(265,455)">
    <rect class="node" x="0" y="0" width="150" height="62" rx="12"/>
    <text class="title" x="75" y="24" text-anchor="middle">📈 Progress</text>
    <text class="desc" x="75" y="42" text-anchor="middle">Weight &amp; protein</text>
    <text class="desc" x="75" y="55" text-anchor="middle">trend charts</text>
  </g>

  <!-- Calculators -->
  <g transform="translate(100,320)">
    <rect class="node" x="0" y="0" width="150" height="62" rx="12"/>
    <text class="title" x="75" y="24" text-anchor="middle">🧮 Calculators</text>
    <text class="desc" x="75" y="42" text-anchor="middle">BMR, TDEE &amp;</text>
    <text class="desc" x="75" y="55" text-anchor="middle">calories burned</text>
  </g>

  <!-- Meals -->
  <g transform="translate(178,100)">
    <rect class="node" x="0" y="0" width="150" height="62" rx="12"/>
    <text class="title" x="75" y="24" text-anchor="middle">🥗 Meals</text>
    <text class="desc" x="75" y="42" text-anchor="middle">Protein log +</text>
    <text class="desc" x="75" y="55" text-anchor="middle">barcode scan</text>
  </g>

  <text x="500" y="540" text-anchor="middle" font-size="12" fill="#6b6b6b">All seven tabs read from and write to the same local, on-device data — nothing is ever sent to a server.</text>
</svg>
